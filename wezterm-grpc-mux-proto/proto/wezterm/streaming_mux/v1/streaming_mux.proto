syntax = "proto3";

package wezterm.streaming_mux.v1;

// Experimental gRPC protocol for the side-by-side mux redesign.
//
// Design principles:
//
// - The mux server owns PTY/process lifecycle, authoritative terminal state,
//   canonical pane size, committed scrollback, blob storage, pane lifecycle,
//   reconnect snapshots, opaque per-client layout blobs, and pane focus
//   membership sets.
// - The client owns GUI windows, tabs, split layout, zoom, overlays, active
//   tab/pane selection, rendering, predictive echo overlays, local resize
//   speculation, config interpretation, and domain transformation.
// - Input is explicitly pane-addressed. Focus is metadata used for terminal
//   focus reporting and activity tracking; it is not input routing.
// - The server informs clients about authoritative terminal/session facts. It
//   does not command client UI. UI-oriented wezterm-cli requests are forwarded
//   opaquely to an eligible connected client.
// - Layout is opaque client-owned reconnect metadata. The server persists it
//   but does not interpret it and does not emit layout events in the MVP.
service StreamingMux {
  // Long-lived client control channel. The client opens it; both sides can send
  // registration, focus metadata, resync, and opaque UI relay messages.
  rpc Control(stream ClientControl) returns (stream ServerControl);

  // Session and pane lifecycle.
  rpc CreateSession(CreateSessionRequest) returns (CreateSessionResponse);
  rpc AttachSession(AttachSessionRequest) returns (AttachSessionResponse);
  rpc SpawnPane(SpawnPaneRequest) returns (SpawnPaneResponse);
  rpc ClosePane(ClosePaneRequest) returns (ClosePaneResponse);
  rpc ResizePane(ResizePaneRequest) returns (ResizePaneResponse);

  // Opaque client-owned reconnect metadata. Layout is not server-interpreted
  // topology; it is a blob owned by the persistent client id.
  rpc GetLayout(GetLayoutRequest) returns (GetLayoutResponse);
  rpc UpdateLayout(UpdateLayoutRequest) returns (UpdateLayoutResponse);

  // Opaque UI endpoint relay for wezterm-cli-style requests that target GUI
  // presentation state rather than terminal/session state.
  rpc ForwardUi(ForwardUiRequest) returns (ForwardUiResponse);

  // Pane terminal state replication.
  rpc AttachPane(AttachPaneRequest) returns (PaneSnapshot);
  rpc ReadPane(ReadPaneRequest) returns (stream PaneReadEvent);
  rpc WritePane(stream PaneInput) returns (WritePaneResponse);

  // Authoritative stores. Large blob chunking is deliberately left as an
  // implementation/open design detail; the MVP shape starts with unary reads.
  rpc GetScrollback(GetScrollbackRequest) returns (GetScrollbackResponse);
  rpc GetBlob(GetBlobRequest) returns (GetBlobResponse);
}

// Identifies a mux session. A session is the durable server-side container for
// panes, committed scrollback, blobs, and per-client layout blobs.
message SessionId {
  uint64 value = 1;
}

// Identifies an authoritative server-side pane.
message PaneId {
  uint64 value = 1;
}

// Identifies content-addressed or server-addressed binary data such as encoded
// image data. The exact id scheme is implementation-defined.
message BlobId {
  bytes value = 1;
}

// Stable client identity for reconnect and persisted layout ownership.
//
// The MVP client may hard-code this. The protocol still assumes it exists from
// the start because adding stable identity later would affect layout ownership,
// reconnect behavior, and focus cleanup.
message PersistentClientId {
  string value = 1;
}

// Ephemeral id assigned by the server to one accepted transport connection.
message ConnectionId {
  uint64 value = 1;
}

// A focus owner within a connection. One client connection may have multiple
// focus scopes, for example multiple GUI windows or surfaces.
message FocusScopeId {
  ConnectionId connection_id = 1;
  uint64 local_scope = 2;
}

message PaneSize {
  uint32 rows = 1;
  uint32 cols = 2;
  uint32 pixel_width = 3;
  uint32 pixel_height = 4;
  uint32 dpi = 5;
}

message BlobRef {
  BlobId id = 1;
  uint64 size = 2;
  string media_type = 3;
}

// Client-chosen reconnect policy for a persistent client id.
enum ReconnectPolicy {
  // Reject this connection with ALREADY_EXISTS if another active connection is
  // already using the same PersistentClientId.
  RECONNECT_POLICY_REFUSE_IF_ACTIVE = 0;

  // Cancel the previous connection, remove all focus scopes owned by it, close
  // its streams, and accept this connection as the replacement.
  RECONNECT_POLICY_TAKE_OVER = 1;
}

message ClientHello {
  PersistentClientId persistent_client_id = 1;
  string wezterm_version = 2;
  repeated string capabilities = 3;
  repeated SessionId desired_sessions = 4;
  ReconnectPolicy reconnect_policy = 5;
}

message ServerHello {
  ConnectionId connection_id = 1;
  string server_version = 2;
  repeated string capabilities = 3;
  repeated SessionSummary sessions = 4;
}

message ClientControl {
  // Empty/zero before ServerHello assigns a connection id.
  ConnectionId connection_id = 1;

  oneof message {
    ClientHello hello = 10;
    ClientFocusChanged focus_changed = 11;
    ClientAck ack = 12;
    ClientRequestResync request_resync = 13;
    ForwardedUiResponse forwarded_ui_response = 14;
  }
}

message ServerControl {
  // Orders messages on the control stream only. It does not define a total
  // order against pane input/output streams or resize RPCs.
  uint64 control_seq = 1;

  oneof message {
    ServerHello hello = 10;
    PaneCreated pane_created = 11;
    PaneSizeChanged pane_size_changed = 12;
    PaneTitleChanged pane_title_changed = 13;
    PaneExited pane_exited = 14;
    PaneRemoved pane_removed = 15;
    NotifyAlert notify_alert = 16;
    ResyncRequired resync_required = 17;
    ForwardedUiRequest forwarded_ui_request = 18;
  }
}

message ClientAck {
  uint64 control_seq = 1;
}

message ClientRequestResync {
  PaneId pane_id = 1;
  string reason = 2;
}

// Focus is pane-addressed metadata. The server tracks, for each pane, the set
// of FocusScopeId values that currently focus it:
//
//   focused_by: map<PaneId, set<FocusScopeId>>
//
// Terminal focus reporting is edge-triggered:
//
// - empty set -> non-empty set: pane.focus_changed(true)
// - non-empty set -> empty set: pane.focus_changed(false)
// - adding/removing another scope while non-empty: no terminal focus event
//
// On abrupt disconnect, the server removes all focus scopes for that connection
// and applies the same edge logic. The server must not assume one client can
// focus only one pane.
message ClientFocusChanged {
  FocusScopeId scope_id = 1;
  PaneId pane_id = 2;
  bool focused = 3;
}

message SessionSummary {
  SessionId session_id = 1;
  repeated PaneSummary panes = 2;
}

message PaneSummary {
  PaneId pane_id = 1;
  PaneSize canonical_size = 2;
  uint64 size_seq = 3;
  uint64 pane_output_seq = 4;
  uint64 scrollback_seq = 5;
  string title = 6;
  bool exited = 7;
}

message CreateSessionRequest {
  PersistentClientId persistent_client_id = 1;
}

message CreateSessionResponse {
  SessionSummary session = 1;
}

message AttachSessionRequest {
  SessionId session_id = 1;
}

message AttachSessionResponse {
  SessionSummary session = 1;
}

message SpawnPaneRequest {
  SessionId session_id = 1;
  PaneSize requested_size = 2;
  SpawnCommand command = 3;
  TerminalConfig terminal_config = 4;
}

message SpawnPaneResponse {
  PaneSummary pane = 1;
}

message SpawnCommand {
  repeated string argv = 1;
  map<string, string> env = 2;
  string cwd = 3;
}

// The determinism-sensitive terminal configuration slice supplied by the
// client. This is intentionally small for the first schema pass; it should be
// expanded from the full TerminalSnapshot/TerminalState inventory as
// implementation starts.
message TerminalConfig {
  uint32 scrollback_lines = 1;
  bool enable_kitty_graphics = 2;
  bool enable_kitty_keyboard = 3;
  bool enable_csi_u_key_encoding = 4;
  bool normalize_output_to_unicode_nfc = 5;
  string unicode_version = 6;
  BidiMode bidi_mode = 7;
}

enum BidiMode {
  BIDI_MODE_UNSPECIFIED = 0;
  BIDI_MODE_DISABLED = 1;
  BIDI_MODE_LEFT_TO_RIGHT = 2;
  BIDI_MODE_RIGHT_TO_LEFT = 3;
}

message ClosePaneRequest {
  PaneId pane_id = 1;
}

message ClosePaneResponse {
  PaneId pane_id = 1;
}

message ResizePaneRequest {
  PaneId pane_id = 1;
  PaneSize requested_size = 2;
  uint64 client_resize_seq = 3;
}

message ResizePaneResponse {
  PaneId pane_id = 1;
  uint64 client_resize_seq = 2;
  uint64 size_seq = 3;
  PaneSize canonical_size = 4;
  ResizeStatus status = 5;
}

message PaneSizeChanged {
  PaneId pane_id = 1;
  uint64 size_seq = 2;
  PaneSize canonical_size = 3;

  // Present when the size change was caused by a request on a live mux
  // connection. Clients may use this for diagnostics or to suppress redundant
  // local work, but server correctness must not rely on UI echoes.
  ConnectionId origin_connection_id = 4;
}

enum ResizeStatus {
  RESIZE_STATUS_UNSPECIFIED = 0;
  RESIZE_STATUS_ACCEPTED = 1;
  RESIZE_STATUS_REJECTED = 2;
}

message PaneCreated {
  SessionId session_id = 1;
  PaneSummary pane = 2;
}

message PaneRemoved {
  PaneId pane_id = 1;
}

message PaneTitleChanged {
  PaneId pane_id = 1;
  string title = 2;
}

message PaneExited {
  PaneId pane_id = 1;
  int32 exit_code = 2;
  string reason = 3;
}

message NotifyAlert {
  PaneId pane_id = 1;
  AlertKind kind = 2;
  string text = 3;

  // Escape hatch for alerts whose shape is still inherited from existing
  // WezTerm internals and has not been lifted into schema fields yet.
  bytes opaque_payload = 100;
}

enum AlertKind {
  ALERT_KIND_UNSPECIFIED = 0;
  ALERT_KIND_BELL = 1;
  ALERT_KIND_OUTPUT_SINCE_FOCUS_LOST = 2;
  ALERT_KIND_PROGRESS = 3;
  ALERT_KIND_USER_VAR = 4;
  ALERT_KIND_TOAST = 5;
}

message ResyncRequired {
  PaneId pane_id = 1;
  string reason = 2;
}

// Opaque client-owned reconnect metadata. The server stores it by
// PersistentClientId, returns the accepted revision, and emits no layout
// events. Layout can only be changed by a connected client.
message ClientLayout {
  uint64 revision = 1;
  string media_type = 2;
  bytes data = 3;
}

message GetLayoutRequest {
  PersistentClientId persistent_client_id = 1;
}

message GetLayoutResponse {
  ClientLayout layout = 1;
}

message UpdateLayoutRequest {
  PersistentClientId persistent_client_id = 1;
  uint64 expected_revision = 2;
  string media_type = 3;
  bytes data = 4;
}

message UpdateLayoutResponse {
  uint64 revision = 1;
}

// Opaque UI request from a CLI endpoint to an eligible connected client.
// If no target is supplied and exactly one eligible client is connected, the
// server may route to it. If multiple clients are eligible, the request is
// ambiguous and must fail unless a target is supplied. The server does not
// inspect the payload.
message ForwardUiRequest {
  PersistentClientId target_persistent_client_id = 1;
  string media_type = 2;
  bytes data = 3;
}

message ForwardUiResponse {
  UiForwardStatus status = 1;
  string error_message = 2;
  bytes data = 3;
}

message ForwardedUiRequest {
  uint64 request_id = 1;
  string media_type = 2;
  bytes data = 3;
}

message ForwardedUiResponse {
  uint64 request_id = 1;
  UiForwardStatus status = 2;
  string error_message = 3;
  bytes data = 4;
}

enum UiForwardStatus {
  UI_FORWARD_STATUS_UNSPECIFIED = 0;
  UI_FORWARD_STATUS_OK = 1;
  UI_FORWARD_STATUS_REFUSED = 2;
  UI_FORWARD_STATUS_NO_RECEIVER = 3;
  UI_FORWARD_STATUS_AMBIGUOUS_RECEIVER = 4;
  UI_FORWARD_STATUS_ERROR = 5;
}

message AttachPaneRequest {
  PaneId pane_id = 1;
}

// Snapshot of authoritative pane state at an exact continuation sequence.
//
// The server must capture the snapshot and the stream continuation point in one
// critical section at a clean parser boundary. ReadPane with
// start_after_pane_output_seq set to this pane_output_seq must provide exact
// continuation with no missed or duplicated PTY output bytes.
message PaneSnapshot {
  PaneId pane_id = 1;
  uint64 pane_output_seq = 2;
  uint64 scrollback_seq = 3;
  uint64 size_seq = 4;
  PaneSize canonical_size = 5;
  TerminalSnapshot terminal = 6;
  repeated BlobRef blobs = 7;
}

message ReadPaneRequest {
  PaneId pane_id = 1;
  uint64 start_after_pane_output_seq = 2;
  uint64 start_after_scrollback_seq = 3;
}

message PaneReadEvent {
  PaneId pane_id = 1;

  oneof event {
    PtyOutput output = 10;
    ScrollbackCommit scrollback_commit = 11;
    ScrollbackClear scrollback_clear = 12;
    ScrollbackDropBefore scrollback_drop_before = 13;
    PaneViewportHash viewport_hash = 14;
    PaneCheckpoint checkpoint = 15;
    ResyncRequired resync_required = 16;
    ClipboardChanged clipboard_changed = 17;
  }
}

// One PTY read equals one PtyOutput event equals one advance_bytes call on every
// replica. Do not re-chunk until the grapheme-flush caveat is fixed.
message PtyOutput {
  uint64 pane_output_seq = 1;
  bytes data = 2;
}

message PaneViewportHash {
  uint64 pane_output_seq = 1;
  uint64 hash = 2;
  string algorithm = 3;
}

message PaneCheckpoint {
  uint64 pane_output_seq = 1;
  uint64 scrollback_seq = 2;
  uint64 size_seq = 3;
}

// Terminal-originated OSC 52 clipboard mutation. The server does not store
// clipboard contents. Clients decide whether/how to apply the request.
message ClipboardChanged {
  ClipboardSelection selection = 1;

  oneof action {
    string set_text = 10;
    bool clear = 11;
  }
}

enum ClipboardSelection {
  CLIPBOARD_SELECTION_UNSPECIFIED = 0;
  CLIPBOARD_SELECTION_CLIPBOARD = 1;
  CLIPBOARD_SELECTION_PRIMARY = 2;
}

// Protocol DTO for reconstructing a shadow terminal at a clean continuation
// point. This is not a serialized Rust TerminalState. The exact field set must
// be driven by the full state inventory; opaque_terminal_state is a temporary
// escape hatch while the DTO is sharpened.
message TerminalSnapshot {
  PaneSize size = 1;
  uint64 viewport_top_row_id = 2;
  uint64 cursor_row_id = 3;
  uint32 cursor_col = 4;
  CursorState cursor = 5;
  TerminalModes modes = 6;
  ColorPalette palette = 7;
  repeated SnapshotRow viewport_rows = 8;
  repeated CommittedRow recent_scrollback = 9;
  repeated BlobRef blobs = 10;

  // OSC 8 hyperlink active in the pen at the snapshot boundary. Output after
  // attach may inherit this until the terminal app clears or replaces it.
  Hyperlink active_hyperlink = 11;

  // TODO: replace with explicit fields for margins, saved cursor, charsets, tab
  // stops, scroll region, alt-screen, unicode-version stack, kitty image
  // counters, stable_row_index_offset, and other TerminalState inventory.
  bytes opaque_terminal_state = 100;
}

message TerminalModes {
  bool application_cursor_keys = 1;
  bool application_keypad = 2;
  bool bracketed_paste = 3;
  bool focus_reporting = 4;
  bool mouse_reporting = 5;

  // TODO: replace with explicit mode fields as the snapshot DTO is completed.
  bytes opaque_modes = 100;
}

message CursorState {
  CursorShape shape = 1;
  CursorVisibility visibility = 2;
  bool blink = 3;
}

enum CursorShape {
  CURSOR_SHAPE_UNSPECIFIED = 0;
  CURSOR_SHAPE_BLOCK = 1;
  CURSOR_SHAPE_UNDERLINE = 2;
  CURSOR_SHAPE_BAR = 3;
}

enum CursorVisibility {
  CURSOR_VISIBILITY_UNSPECIFIED = 0;
  CURSOR_VISIBILITY_VISIBLE = 1;
  CURSOR_VISIBILITY_HIDDEN = 2;
}

message SnapshotRow {
  uint64 row_id = 1;
  uint32 source_cols = 2;
  bool soft_wrapped_to_next = 3;
  repeated CellRun runs = 4;
  repeated BlobRef blobs = 5;
  repeated Hyperlink hyperlinks = 6;
}

message CommittedRow {
  uint64 row_id = 1;
  uint32 source_cols = 2;
  bool soft_wrapped_to_next = 3;
  repeated CellRun runs = 4;
  repeated BlobRef blobs = 5;
  repeated Hyperlink hyperlinks = 6;
}

message CellRun {
  // UTF-8 text for the run.
  string text = 1;
  CellAttrs attrs = 2;

  // Cell width of the run, needed for wide characters and spacing.
  uint32 width = 3;
}

message CellAttrs {
  Color fg_color = 1;
  Color bg_color = 2;
  Color underline_color = 3;
  Intensity intensity = 4;
  Underline underline = 5;
  bool italic = 6;
  Blink blink = 7;
  bool reverse = 8;
  bool strikethrough = 9;
  bool invisible = 10;
  bool overline = 11;
  SemanticType semantic_type = 12;

  // 0 means no hyperlink. Otherwise this is 1 + index into the row's
  // hyperlinks table, preserving shared hyperlink identity without repeating
  // the URI on every cell.
  uint32 hyperlink_index = 13;
}

message Color {
  oneof value {
    bool default_color = 1;
    uint32 palette_index = 2;
    uint32 true_color_rgb = 3;
  }
}

enum Intensity {
  INTENSITY_UNSPECIFIED = 0;
  INTENSITY_NORMAL = 1;
  INTENSITY_BOLD = 2;
  INTENSITY_HALF = 3;
}

enum Underline {
  UNDERLINE_UNSPECIFIED = 0;
  UNDERLINE_NONE = 1;
  UNDERLINE_SINGLE = 2;
  UNDERLINE_DOUBLE = 3;
  UNDERLINE_CURLY = 4;
  UNDERLINE_DOTTED = 5;
  UNDERLINE_DASHED = 6;
}

enum Blink {
  BLINK_UNSPECIFIED = 0;
  BLINK_NONE = 1;
  BLINK_SLOW = 2;
  BLINK_RAPID = 3;
}

enum SemanticType {
  SEMANTIC_TYPE_UNSPECIFIED = 0;
  SEMANTIC_TYPE_OUTPUT = 1;
  SEMANTIC_TYPE_PROMPT = 2;
  SEMANTIC_TYPE_INPUT = 3;
}

message Hyperlink {
  string uri = 1;
  map<string, string> params = 2;
}

message ColorPalette {
  repeated RgbColor colors = 1;
  RgbColor foreground = 2;
  RgbColor background = 3;
  RgbColor cursor_fg = 4;
  RgbColor cursor_bg = 5;
  RgbColor cursor_border = 6;
  RgbColor selection_fg = 7;
  RgbColor selection_bg = 8;
  RgbColor scrollbar_thumb = 9;
  RgbColor split = 10;
  RgbColor compose_cursor = 11;
}

message RgbColor {
  uint32 red = 1;
  uint32 green = 2;
  uint32 blue = 3;
}

// Input is explicitly pane-addressed. Ordering is guaranteed within one
// WritePane stream, but not relative to ReadPane output or ResizePane RPCs.
message PaneInput {
  PaneId pane_id = 1;
  uint64 client_input_seq = 2;

  oneof input {
    bytes raw_bytes = 10;
    KeyEvent key = 11;
    MouseEvent mouse = 12;
    Paste paste = 13;
  }
}

message WritePaneResponse {
  PaneId pane_id = 1;
  uint64 last_client_input_seq = 2;
}

// Placeholder key representation. The production mapping should follow the
// existing wezterm input model rather than freezing this shape prematurely.
message KeyEvent {
  string key = 1;
  uint32 modifiers = 2;
  string raw_encoding_hint = 3;
}

message MouseEvent {
  uint32 x = 1;
  uint32 y = 2;
  uint32 button = 3;
  uint32 modifiers = 4;
  MouseEventKind kind = 5;
}

enum MouseEventKind {
  MOUSE_EVENT_KIND_UNSPECIFIED = 0;
  MOUSE_EVENT_KIND_PRESS = 1;
  MOUSE_EVENT_KIND_RELEASE = 2;
  MOUSE_EVENT_KIND_DRAG = 3;
  MOUSE_EVENT_KIND_MOVE = 4;
  MOUSE_EVENT_KIND_WHEEL = 5;
}

message Paste {
  string text = 1;
}

message ScrollbackCommit {
  uint64 scrollback_seq = 1;
  repeated CommittedRow rows = 2;
}

message ScrollbackClear {
  uint64 scrollback_seq = 1;
}

message ScrollbackDropBefore {
  uint64 scrollback_seq = 1;
  uint64 first_retained_row_id = 2;
}

message GetScrollbackRequest {
  PaneId pane_id = 1;
  uint64 start_row_id = 2;
  uint64 limit = 3;
}

message GetScrollbackResponse {
  uint64 scrollback_seq = 1;
  repeated CommittedRow rows = 2;
}

message GetBlobRequest {
  BlobId id = 1;
}

message GetBlobResponse {
  BlobRef blob = 1;
  bytes data = 2;
}
