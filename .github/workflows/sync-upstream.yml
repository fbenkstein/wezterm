name: Sync with upstream

on:
  schedule:
    - cron: '0 6 * * 1'  # Every Monday at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: git remote add upstream https://github.com/wez/wezterm.git

      - name: Fetch upstream main and dot-github branch
        run: |
          git fetch upstream main
          git fetch origin dot-github

      - name: Merge upstream main
        # -X theirs auto-resolves conflicts in favour of upstream
        run: git merge upstream/main --no-edit -X theirs

      - name: Restore custom .github
        run: |
          git checkout origin/dot-github -- .github/
          if ! git diff --cached --quiet; then
            git commit -m "chore: restore custom .github after upstream sync [skip ci]"
          fi

      - name: Push to fork main
        run: git push origin main
