name: Sync with upstream

on:
  schedule:
    - cron: '0 6 * * 1'  # Every Monday at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GIT_AUTHOR_NAME: github-actions[bot]
      GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
      GIT_COMMITTER_NAME: github-actions[bot]
      GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
    steps:
      - name: Clone fork as bare repo
        run: git clone --bare "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" repo.git

      - name: Fetch upstream and dot-github
        working-directory: repo.git
        run: |
          git remote add upstream https://github.com/wez/wezterm.git
          git fetch upstream refs/heads/main:refs/remotes/upstream/main
          git fetch origin refs/heads/dot-github:refs/remotes/origin/dot-github

      - name: Build and push merge commit
        working-directory: repo.git
        run: |
          GIT_INDEX_FILE=$(mktemp)
          export GIT_INDEX_FILE

          # Populate temp index from upstream/main tree
          git read-tree upstream/main

          # Replace .github entirely with the version from dot-github
          git rm --cached -r -- .github
          git read-tree --prefix=.github/ origin/dot-github:.github

          TREE=$(git write-tree)
          COMMIT=$(git commit-tree "$TREE" \
            -p "$(git rev-parse upstream/main)" \
            -p "$(git rev-parse origin/dot-github)" \
            -m "chore: sync with upstream [skip ci]")

          # Force push: fork/main is always exactly one merge commit ahead of upstream/main
          git push origin "$COMMIT:refs/heads/main" --force
