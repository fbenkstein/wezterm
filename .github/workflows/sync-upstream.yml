name: Sync with upstream

on:
  schedule:
    - cron: '0 6 * * 1'  # Every Monday at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GIT_AUTHOR_NAME: github-actions[bot]
      GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
      GIT_COMMITTER_NAME: github-actions[bot]
      GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
    steps:
      - name: Init bare repo and fetch
        run: |
          git init --bare repo.git
          git -C repo.git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}"
          git -C repo.git remote add upstream https://github.com/wez/wezterm.git
          git -C repo.git fetch origin refs/heads/dot-github:refs/remotes/origin/dot-github
          git -C repo.git fetch upstream refs/heads/main:refs/remotes/upstream/main

      - name: Build and push merge commit
        working-directory: repo.git
        run: |
          set -x
          GIT_INDEX_FILE=$(mktemp)
          export GIT_INDEX_FILE

          # Populate temp index from upstream/main tree
          git read-tree upstream/main

          # Replace .github entirely with the version from dot-github
          # (git rm --cached requires a work tree even for bare repos; use update-index instead)
          git ls-files -z -- .github | xargs -0 git update-index --force-remove
          git read-tree --prefix=.github/ origin/dot-github:.github

          TREE=$(git write-tree)
          COMMIT=$(git commit-tree "$TREE" \
            -p "$(git rev-parse upstream/main)" \
            -p "$(git rev-parse origin/dot-github)" \
            -m "chore: sync with upstream [skip ci]")

          # Force push: fork/main is always exactly one merge commit ahead of upstream/main
          git push origin "$COMMIT:refs/heads/main" --force
