name: Sync with upstream

on:
  schedule:
    - cron: '0 6 * * 1'  # Every Monday at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: git remote add upstream https://github.com/wez/wezterm.git

      - name: Fetch upstream main and dot-github branch
        run: |
          git fetch upstream main
          git fetch origin dot-github

      - name: Merge upstream main and restore custom .github
        # --no-commit leaves the merge staged so we can overlay .github before committing
        run: |
          git merge upstream/main --no-commit --no-edit -X theirs || true
          git rm -rf .github/
          git checkout origin/dot-github -- .github/
          git commit -m "chore: sync with upstream [skip ci]"

      - name: Push to fork main
        run: git push origin main
