# Builds statically-linked wezterm-mux-server binaries for Linux musl targets.
# Each target is an independent job. Artifacts are uploaded per target and can
# be consumed by combined build workflows.
name: Build Linux mux server

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: taiki-e/install-action@cross

      - name: Build
        run: bash .github/scripts/build-mux-linux.sh ${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: mux-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/wezterm-mux-server
          retention-days: 5
